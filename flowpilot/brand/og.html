<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<style>
  @font-face{font-family:'Bebas';src:url('FONT/BebasNeue-Regular.ttf') format('truetype')}
  @font-face{font-family:'Space Grotesk';src:url('FONT/SpaceGrotesk.ttf') format('truetype');font-weight:300 700}
  *{margin:0;box-sizing:border-box}
  .card{width:1200px;height:630px;position:relative;overflow:hidden;background:#080c1a;
    font-family:'Space Grotesk',sans-serif;color:#eaf0ff;display:flex;align-items:center;gap:40px;padding:0 78px}
  .glow{position:absolute;top:-30%;left:8%;width:640px;height:520px;
    background:radial-gradient(closest-side,rgba(91,124,255,.5),transparent 70%);filter:blur(20px)}
  .glow2{position:absolute;bottom:-40%;right:-8%;width:560px;height:520px;
    background:radial-gradient(closest-side,rgba(124,92,255,.4),transparent 70%);filter:blur(20px)}
  .grid{position:absolute;inset:0;opacity:.05;
    background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
    background-size:56px 56px;mask-image:radial-gradient(circle at 35% 40%,#000 45%,transparent 85%)}
  .col{position:relative;flex:1}
  .brand{display:inline-flex;align-items:center;gap:14px;margin-bottom:30px}
  .brand svg{width:52px;height:52px}
  .wm{font-weight:700;font-size:2rem;letter-spacing:-.02em}
  .g{background:linear-gradient(120deg,#4f8cff,#7c5cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-family:'Bebas',sans-serif;font-weight:400;font-size:6.4rem;line-height:.9;letter-spacing:.01em}
  .sub{margin-top:24px;font-size:1.4rem;color:#93a1c8;max-width:560px}
  .art{position:relative;flex:none;width:330px;height:330px;display:flex;align-items:center;justify-content:center}
  .art svg{width:100%;height:100%;filter:drop-shadow(0 26px 60px rgba(79,140,255,.5))}
</style></head>
<body>
<div class="card">
  <div class="glow"></div><div class="glow2"></div><div class="grid"></div>
  <div class="col">
    <div class="brand">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="fp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
        <rect width="100" height="100" rx="24" fill="url(#fp)"/><rect x="12" y="12" width="76" height="76" rx="18" fill="none" stroke="#fff" stroke-width="4"/>
        <g transform="translate(50 50) scale(2.05) translate(-12 -9)"><path fill="#fff" d="M21.7 2.3a1 1 0 0 0-1.05-.23L2.9 8.36c-.86.32-.8 1.57.09 1.8l6.2 1.6 1.6 6.2c.23.9 1.48.95 1.8.09l6.29-17.7a1 1 0 0 0-.18-1.05z"/></g></svg>
      <span class="wm">Flow<span class="g">Pilot</span></span>
    </div>
    <h1>O <span class="g">piloto</span><br>dos seus posts</h1>
    <p class="sub">Agenda e publica no seu Instagram sozinho. Feed, stories, carrossel e reels.</p>
  </div>
  <div class="art">
    <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="url(#fp)"/><rect x="12" y="12" width="76" height="76" rx="18" fill="none" stroke="#fff" stroke-width="4"/>
      <g transform="translate(50 50) scale(2.05) translate(-12 -9)"><path fill="#fff" d="M21.7 2.3a1 1 0 0 0-1.05-.23L2.9 8.36c-.86.32-.8 1.57.09 1.8l6.2 1.6 1.6 6.2c.23.9 1.48.95 1.8.09l6.29-17.7a1 1 0 0 0-.18-1.05z"/></g></svg>
  </div>
</div>
</body></html>
