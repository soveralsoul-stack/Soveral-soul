<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<style>
  @font-face{font-family:'Bebas';src:url('../assets/fonts/BebasNeue-Regular.ttf') format('truetype')}
  @font-face{font-family:'Space Grotesk';src:url('../assets/fonts/SpaceGrotesk.ttf') format('truetype');font-weight:300 700}
  *{margin:0;box-sizing:border-box}
  .card{width:1080px;height:1920px;position:relative;overflow:hidden;background:#080c1a;
    font-family:'Space Grotesk',sans-serif;color:#eaf0ff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 90px}
  .glow{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:760px;height:620px;
    background:radial-gradient(closest-side,rgba(91,124,255,.5),transparent 70%);filter:blur(30px)}
  .glow2{position:absolute;bottom:2%;right:-15%;width:640px;height:600px;
    background:radial-gradient(closest-side,rgba(124,92,255,.42),transparent 70%);filter:blur(30px)}
  .grid{position:absolute;inset:0;opacity:.05;
    background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
    background-size:64px 64px;mask-image:radial-gradient(circle at 50% 40%,#000 45%,transparent 85%)}
  .mark{position:relative;width:300px;height:300px;margin-bottom:64px;filter:drop-shadow(0 30px 70px rgba(79,140,255,.5))}
  .kick{position:relative;font-size:34px;letter-spacing:.28em;text-transform:uppercase;color:#4f8cff;margin-bottom:26px}
  h1{position:relative;font-family:'Bebas',sans-serif;font-weight:400;font-size:150px;line-height:.92;letter-spacing:.01em}
  h1 .g{background:linear-gradient(120deg,#4f8cff,#7c5cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{position:relative;margin-top:40px;font-size:40px;color:#93a1c8;line-height:1.5;max-width:820px}
  .foot{position:absolute;bottom:110px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}
  .foot svg{width:56px;height:56px}
  .foot .wm{font-weight:700;font-size:44px;letter-spacing:-.02em}
  .foot .wm .g{background:linear-gradient(120deg,#4f8cff,#7c5cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
</style></head>
<body>
<div class="card">
  <div class="glow"></div><div class="glow2"></div><div class="grid"></div>
  <svg class="mark" viewBox="0 0 100 100"><defs><linearGradient id="fp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
    <rect width="100" height="100" rx="24" fill="url(#fp)"/><rect x="12" y="12" width="76" height="76" rx="18" fill="none" stroke="#fff" stroke-width="4"/>
    <g transform="translate(50 50) scale(2.05) translate(-12 -9)"><path fill="#fff" d="M21.7 2.3a1 1 0 0 0-1.05-.23L2.9 8.36c-.86.32-.8 1.57.09 1.8l6.2 1.6 1.6 6.2c.23.9 1.48.95 1.8.09l6.29-17.7a1 1 0 0 0-.18-1.05z"/></g></svg>
  <div class="kick">Publicação automática</div>
  <h1>Funcionou<span class="g">.</span></h1>
  <div class="sub">Este story foi publicado sozinho, via API. Teste de publicação do FlowPilot.</div>
  <div class="foot">
    <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="url(#fp)"/><rect x="12" y="12" width="76" height="76" rx="18" fill="none" stroke="#fff" stroke-width="4"/>
      <g transform="translate(50 50) scale(2.05) translate(-12 -9)"><path fill="#fff" d="M21.7 2.3a1 1 0 0 0-1.05-.23L2.9 8.36c-.86.32-.8 1.57.09 1.8l6.2 1.6 1.6 6.2c.23.9 1.48.95 1.8.09l6.29-17.7a1 1 0 0 0-.18-1.05z"/></g></svg>
    <span class="wm">Flow<span class="g">Pilot</span></span>
  </div>
</div>
</body></html>
