<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<style>
  @font-face{ font-family:'Bebas Neue'; src:url('../../public/fonts/BebasNeue-Regular.ttf') format('truetype'); font-weight:400; }
  @font-face{ font-family:'Space Grotesk'; src:url('../../public/fonts/SpaceGrotesk.ttf') format('truetype'); font-weight:300 700; }
  :root{
    --ink:#0d1420; --ink2:#111a2b; --line:#24344d;
    --gold:#e0a64e; --blue:#2d8fff; --white:#eef3fb; --muted:#8fa2bd;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  .card{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--ink);
    font-family:'Space Grotesk',sans-serif;color:var(--white);display:flex;flex-direction:column}

  /* ---------- SLOT DA FOTO (o que o cliente envia / IA gera) ---------- */
  .photo{position:relative;height:812px;flex:0 0 auto;overflow:hidden;
    /* placeholder: gradiente elegante no lugar da foto real */
    background:
      radial-gradient(120% 90% at 70% 10%, #2a3d5c 0%, #16233a 55%, #0d1826 100%);}
  .photo .grid{position:absolute;inset:0;opacity:.10;
    background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
    background-size:60px 60px}
  .bldg{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);opacity:.16}
  .slot-tag{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;white-space:nowrap;
    background:rgba(8,14,24,.55);border:1px solid rgba(255,255,255,.18);border-radius:999px;
    padding:12px 22px;font-size:20px;letter-spacing:.5px;color:#cdd9ec;backdrop-filter:blur(2px)}
  .photo .fade{position:absolute;left:0;right:0;bottom:0;height:260px;
    background:linear-gradient(to bottom,transparent,var(--ink))}
  .badge{position:absolute;top:40px;left:40px;background:var(--gold);color:#20160a;
    font-family:'Bebas Neue';font-size:30px;letter-spacing:2px;padding:10px 22px;border-radius:4px}
  .clogo{position:absolute;top:40px;right:40px;display:flex;align-items:center;gap:12px}
  .clogo .mark{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue';font-size:22px;color:#fff}
  .clogo .nm{font-family:'Bebas Neue';font-size:30px;letter-spacing:2px}
  .clogo .nm b{color:var(--gold);font-weight:400}

  /* ---------- BARRA DE INFO (moldura da marca) ---------- */
  .info{flex:1;padding:44px 60px 56px;display:flex;flex-direction:column}
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:20px;letter-spacing:5px;
    text-transform:uppercase;color:var(--muted)}
  .eyebrow .ln{width:40px;height:1px;background:var(--gold)}
  .price{font-family:'Bebas Neue';font-size:132px;line-height:.9;letter-spacing:1px;margin-top:10px;color:#fff}
  .price small{color:var(--muted);font-size:34px;letter-spacing:1px;font-family:'Space Grotesk';font-weight:400}
  .specs{display:flex;gap:14px;margin-top:34px}
  .spec{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
    border:1px solid var(--line);border-radius:10px;padding:20px 8px;background:rgba(255,255,255,.02)}
  .spec svg{width:34px;height:34px;stroke:var(--gold)}
  .spec .v{font-family:'Bebas Neue';font-size:40px;letter-spacing:1px;line-height:1}
  .spec .k{font-size:16px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .cta{background:var(--blue);color:#04101f;font-family:'Space Grotesk';font-weight:600;
    font-size:26px;letter-spacing:.5px;padding:20px 34px;border-radius:6px}
  .loc{font-size:24px;color:var(--muted);text-align:right;line-height:1.4}
  .loc b{color:#fff}
</style></head><body>
  <div class="card">
    <!-- SLOT DA FOTO -->
    <div class="photo">
      <div class="grid"></div>
      <svg class="bldg" width="360" height="360" viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="0.6">
        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M8 9h1M11 9h1M14 9h1M8 12h1M11 12h1M14 12h1"/>
      </svg>
      <div class="slot-tag">📷 Foto do imóvel — enviada pelo cliente (ou gerada/melhorada por IA)</div>
      <div class="badge">À VENDA</div>
      <div class="clogo"><div class="mark">IM</div><div class="nm">IMÓVEIS<b>PRO</b></div></div>
      <div class="fade"></div>
    </div>

    <!-- MOLDURA DA MARCA -->
    <div class="info">
      <div class="eyebrow"><span class="ln"></span> Apartamento · Jardim Itália</div>
      <div class="price">R$ 720.000 <small>&nbsp;· 92 m²</small></div>

      <div class="specs">
        <div class="spec">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4M2 17h20M4 11V7a1 1 0 0 1 1-1h6M20 11V7a1 1 0 0 0-1-1h-6M2 17v3M22 17v3"/></svg>
          <div class="v">3</div><div class="k">Quartos</div>
        </div>
        <div class="spec">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V6a2 2 0 0 1 2-2 2 2 0 0 1 2 2M2 12h20v3a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM6 19l-1 2M18 19l1 2"/></svg>
          <div class="v">2</div><div class="k">Banheiros</div>
        </div>
        <div class="spec">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13M5 13h14v4H5zM7 17v2M17 17v2M7 13.5h.01M17 13.5h.01"/></svg>
          <div class="v">2</div><div class="k">Vagas</div>
        </div>
        <div class="spec">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12M3 21h18M8 21v-6h8v6"/></svg>
          <div class="v">Novo</div><div class="k">Estado</div>
        </div>
      </div>

      <div class="foot">
        <div class="cta">Agende sua visita →</div>
        <div class="loc"><b>(49) 9 9911-8781</b><br>@imoveispro · Chapecó/SC</div>
      </div>
    </div>
  </div>
</body></html>
