<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<style>
  @font-face{ font-family:'Space Grotesk'; src:url('../../public/fonts/SpaceGrotesk.ttf') format('truetype'); font-weight:300 700; }
  :root{ --a1:#4f8cff; --a2:#7c5cff; --navy:#0b1020; }
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif}
  .plane{fill:#fff}
  /* ÍCONE (quadrado arredondado com gradiente) */
  .icon{border-radius:22%;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center}
  .icon svg{width:52%;height:52%}
  /* PERFIL (full bleed, será cortado em círculo pelo IG) */
  .profile{width:100%;height:100%;background:radial-gradient(120% 120% at 30% 20%,#6b8cff,#5b5cff 55%,#4a3ad6 100%);display:flex;align-items:center;justify-content:center}
  .profile svg{width:46%;height:46%}
  /* WORDMARK */
  .lockup{display:flex;align-items:center;gap:26px}
  .lockup .mk{width:120px;height:120px;border-radius:28px;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center}
  .lockup .mk svg{width:60px;height:60px}
  .wm{font-weight:700;font-size:104px;letter-spacing:-2.5px;line-height:1}
  .wm .g{background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
</style></head><body>
<script>
  const PLANE = '<svg viewBox="0 0 24 24"><path class="plane" d="M21.7 2.3a1 1 0 0 0-1.05-.23L2.9 8.36c-.86.32-.8 1.57.09 1.8l6.2 1.6 1.6 6.2c.23.9 1.48.95 1.8.09l6.29-17.7a1 1 0 0 0-.18-1.05zM10.3 12.3l7.3-6.4-5.1 7.9-.9 3.5-1.3-5z"/></svg>';
  const mode = new URLSearchParams(location.search).get('mode') || 'icon';
  const el = document.body;
  if (mode === 'icon' || mode === 'favicon') {
    const s = mode === 'favicon' ? 256 : 1024;
    el.innerHTML = `<div class="icon" style="width:${s}px;height:${s}px">${PLANE}</div>`;
  } else if (mode === 'profile') {
    el.innerHTML = `<div class="profile">${PLANE}</div>`;
  } else if (mode === 'wm-dark') {
    el.innerHTML = `<div class="lockup"><div class="mk">${PLANE}</div><div class="wm" style="color:#eaf0ff">Post<span class="g">Pilot</span></div></div>`;
  } else if (mode === 'wm-light') {
    el.innerHTML = `<div class="lockup"><div class="mk">${PLANE}</div><div class="wm" style="color:#0b1020">Post<span class="g">Pilot</span></div></div>`;
  }
</script>
</body></html>
