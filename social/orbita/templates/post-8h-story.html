<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Post 8h — story 9:16</title>
<style>
@font-face{font-family:'BS';src:url('../build/fonts/BigShoulders-Bold.ttf') format('truetype');font-weight:700}
@font-face{font-family:'IN';src:url('../build/fonts/InstrumentSans-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'IN';src:url('../build/fonts/InstrumentSans-Bold.ttf') format('truetype');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0A1422;--teal:#5BC1D4;--white:#FFF}
body{background:#111}
.card{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy);
  font-family:'IN',sans-serif;color:var(--white)}

/* A foto (1125x2000) entra praticamente inteira em 1080x1920. */
.foto{position:absolute;inset:0;background-image:url('../../acervo/retrato-sofa-perto.jpg');
  background-size:cover;background-position:50% 22%;z-index:1}
/* Escurece de baixo para cima: o rosto fica limpo, o texto ganha fundo solido. */
.tone{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(10,20,34,.92) 0%,rgba(10,20,34,.72) 10%,
             rgba(10,20,34,.34) 18%,rgba(10,20,34,0) 30%,rgba(10,20,34,.20) 44%,rgba(10,20,34,.80) 55%,
             rgba(10,20,34,.97) 64%,rgba(10,20,34,1) 100%)}
.tint{position:absolute;inset:0;z-index:3;mix-blend-mode:soft-light;
  background:radial-gradient(85% 40% at 12% 80%,rgba(91,193,212,.7),transparent 62%)}

/* ---- zonas seguras do Instagram ----
   O topo (~250px) leva a barra de progresso e o perfil; a base (~250px) leva
   a caixa de resposta. Todo o conteudo vive entre 280px e 1660px. */
.top{position:absolute;top:290px;left:72px;z-index:10}
.wm{font-family:'BS';font-weight:700;font-size:48px;letter-spacing:.055em;line-height:1}
.wm b{color:var(--teal);font-weight:700}
.wm .l2{display:block;margin-top:7px;font-family:'IN';font-size:15px;font-weight:700;
  letter-spacing:.42em;color:rgba(255,255,255,.72)}

.bloco{position:absolute;left:72px;right:72px;top:1145px;z-index:10}
.rule{width:76px;height:6px;background:var(--teal);border-radius:4px;margin-bottom:32px}
h1{font-family:'BS';font-weight:700;font-size:104px;line-height:.96;text-transform:uppercase;
  letter-spacing:.01em}
h1 .cy{color:var(--teal)}
.oferta{margin-top:34px;font-size:44px;line-height:1.34;color:rgba(255,255,255,.95);max-width:900px}
.oferta b{color:var(--teal);font-weight:700}

.hand{position:absolute;left:72px;bottom:262px;z-index:10;font-size:21px;font-weight:700;
  letter-spacing:.2em;color:rgba(255,255,255,.55)}
</style></head><body>

<div class="card">
  <div class="foto"></div>
  <div class="tone"></div>
  <div class="tint"></div>

  <div class="top">
    <div class="wm">SOVERAL<b>SOUL</b><span class="l2">SERVIÇOS DE IA</span></div>
  </div>

  <div class="bloco">
    <div class="rule"></div>
    <h1>Eu não vendo IA.<br>Eu acho <span class="cy">onde dói</span>.</h1>
    <p class="oferta">Mapeio <b>onde a sua empresa perde tempo e dinheiro</b>, e automatizo
    só esse ponto.</p>
  </div>

  <div class="hand">@SOVERALSOUL</div>
</div>

</body></html>
