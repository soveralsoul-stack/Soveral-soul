<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Exata — story em video</title>
<style>
@font-face{font-family:'BS';src:url('../build/fonts/BigShoulders-Bold.ttf') format('truetype');font-weight:700}
@font-face{font-family:'IN';src:url('../build/fonts/InstrumentSans-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'IN';src:url('../build/fonts/InstrumentSans-Bold.ttf') format('truetype');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0A1422;--teal:#5BC1D4;--amber:#D9A85C;--white:#FFF}
body{background:#111}
.card{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy);
  font-family:'IN',sans-serif;color:var(--white)}

/* A foto (3213x5712) e 9:16 quase exato, entra inteira. */
.foto{position:absolute;inset:0;background-image:url('../../acervo/exata-salao-imovel.jpg');
  background-size:cover;background-position:50% 50%;z-index:1}
.tone{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(10,20,34,.94) 0%,rgba(10,20,34,.76) 10%,
             rgba(10,20,34,.36) 17%,rgba(10,20,34,.02) 25%,rgba(10,20,34,.06) 48%,
             rgba(10,20,34,.60) 58%,rgba(10,20,34,.94) 66%,rgba(10,20,34,1) 74%)}
.tint{position:absolute;inset:0;z-index:3;mix-blend-mode:soft-light;
  background:radial-gradient(85% 42% at 14% 82%,rgba(91,193,212,.72),transparent 62%)}

/* zonas seguras: conteudo entre 280px e 1660px */
.top{position:absolute;top:290px;left:72px;right:72px;z-index:10;
  display:flex;align-items:flex-start;justify-content:space-between}
.wm{font-family:'BS';font-weight:700;font-size:48px;letter-spacing:.055em;line-height:1}
.wm b{color:var(--teal);font-weight:700}
.wm .l2{display:block;margin-top:7px;font-family:'IN';font-size:15px;font-weight:700;
  letter-spacing:.42em;color:rgba(255,255,255,.72)}
.local{text-align:right;font-size:16px;font-weight:700;letter-spacing:.2em;line-height:1.5;
  color:var(--teal);padding:12px 18px;border:2px solid rgba(91,193,212,.45);border-radius:14px;
  background:rgba(10,20,34,.62)}

.bloco{position:absolute;left:72px;right:72px;top:1080px;z-index:10}
.tag{display:inline-block;font-size:20px;font-weight:700;letter-spacing:.2em;border-radius:40px;
  padding:13px 26px 11px;background:var(--teal);color:var(--navy);margin-bottom:30px}
h1{font-family:'BS';font-weight:700;font-size:96px;line-height:.95;text-transform:uppercase;
  letter-spacing:.01em}
h1 .cy{color:var(--teal)}
.sub{margin-top:26px;font-size:38px;line-height:1.3;color:rgba(255,255,255,.95)}
.sub b{color:var(--white);font-weight:700}
.zap{margin-top:26px;font-family:'BS';font-weight:700;font-size:50px;letter-spacing:.02em;
  color:var(--teal);line-height:1}
.hand{position:absolute;left:72px;bottom:262px;z-index:10;font-size:21px;font-weight:700;
  letter-spacing:.2em;color:rgba(255,255,255,.55)}

/* ---- motion (variante em video, 15s) ----
   Comeca com a foto limpa: o veu, a marca e os textos entram depois, em
   cascata. O empurrao lento na foto roda por baixo o tempo todo. */
.foto{animation:push 15s linear forwards;transform-origin:52% 34%}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.06)}}

/* o veu lava a imagem de baixo para cima aos 1,5s */
.tone{opacity:0;animation:veu 1.5s cubic-bezier(.3,.7,.2,1) 1.5s forwards}
.tint{opacity:0;animation:veu 1.6s ease 1.9s forwards}
@keyframes veu{to{opacity:1}}

/* marca entra deslizando da esquerda, credito do evento vem da direita */
.wm{opacity:0;transform:translateX(-38px);
  animation:fromL .8s cubic-bezier(.2,.8,.2,1) 2.1s forwards}
.local{opacity:0;transform:translateX(38px);
  animation:fromR .8s cubic-bezier(.2,.8,.2,1) 2.45s forwards}
@keyframes fromL{to{opacity:1;transform:none}}
@keyframes fromR{to{opacity:1;transform:none}}

/* a pastilha estica da esquerda antes de o texto aparecer */
.tag{opacity:0;transform:scaleX(.35);transform-origin:left center;
  animation:pill .65s cubic-bezier(.2,1.1,.3,1) 3s forwards}
@keyframes pill{to{opacity:1;transform:none}}

/* manchete sobe linha a linha */
.ln{opacity:0;transform:translateY(54px)}
.l1{animation:rise .85s cubic-bezier(.2,.75,.2,1) 3.45s forwards}
.l2{animation:rise .85s cubic-bezier(.2,.75,.2,1) 3.8s forwards}
@keyframes rise{to{opacity:1;transform:none}}

.sub{opacity:0;transform:translateY(30px);
  animation:rise .9s cubic-bezier(.2,.75,.2,1) 4.5s forwards}
.zap{opacity:0;transform:translateY(26px);
  animation:rise .8s cubic-bezier(.2,.75,.2,1) 5.15s forwards}
.hand{opacity:0;animation:veu .9s ease 5.7s forwards}
</style></head><body>

<div class="card">
  <div class="foto"></div>
  <div class="tone"></div>
  <div class="tint"></div>

  <div class="top">
    <div class="wm">SOVERAL<b>SOUL</b><span class="l2">SERVIÇOS DE IA</span></div>
    <div class="local">SALÃO DO IMÓVEL<br>CHAPECÓ · 2026</div>
  </div>

  <div class="bloco">
    <div class="tag">NO ESTANDE DA EXATA</div>
    <h1><div class="ln l1">Parceria que</div><div class="ln l2">vira <span class="cy">sistema</span></div></h1>
    <p class="sub">Ao lado da <b>Exata</b>, minha grande parceira, desenvolvendo sistemas
    imobiliários de alta performance.</p>
    <div class="zap">(49) 9 9911-8781</div>
  </div>

  <div class="hand">@SOVERALSOUL</div>
</div>

</body></html>
